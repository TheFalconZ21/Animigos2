# Nginx reverse proxy para Animigos Backend en EC2 (Ubuntu 24.04)
# Certbot añadirá automáticamente el bloque SSL (puerto 443) y la redirección HTTP -> HTTPS.

upstream animigos_asgi {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.animigos.app;

    client_max_body_size 15M;

    # Archivos estáticos de Django Admin (generados con collectstatic)
    location /static/ {
        alias /home/ubuntu/Animigos2/animigos-backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
    }

    # Archivos multimedia (846 avatares y uploads) servidos directo por Nginx
    location /media/ {
        alias /home/ubuntu/Animigos2/animigos-backend/media/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
    }

    # WebSockets (Watch Parties en tiempo real — Django Channels / Daphne)
    location /ws/ {
        proxy_pass http://animigos_asgi;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # API REST y Admin de Django
    location / {
        proxy_pass http://animigos_asgi;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 90s;
    }
}
